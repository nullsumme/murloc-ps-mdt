<h1 id="getwowaccount">GetWowAccount</h1>
<p>Returns the wow account <em>(unique to Wow1, Wow2, ...)</em></p>
<div class="language-lua highlight"><pre id="__code_0"><span></span><code><span class="nv">accountname</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="nf">GetWowAccount</span><span class="p">()</span>
</code></pre></div>
<hr>
<h2 id="returns">Returns</h2>
<ul>
<li><strong>accountname</strong><ul>
<li><code>string</code> : The Wow account name</li>
</ul>
</li>
</ul>
<hr>
<h2 id="details">Details</h2>
<p>The account name is unique to a pair of bnet + game account. The game account index is often showen at the end as e.g. <code>#1</code> or <code>#3</code>.</p>
