<h1 id="setplayerfacing">SetPlayerFacing</h1>
<p>Updates the facing of the local player.</p>
<div class="language-lua highlight"><pre id="__code_0"><span></span><code><span class="nf">SetPlayerFacing</span><span class="p">(</span><span class="nv">facing</span><span class="p">)</span>
</code></pre></div>
<hr>
<h2 id="arguments">Arguments</h2>
<ul>
<li><strong>facing</strong><ul>
<li><code>number</code> : Facing in radians</li>
</ul>
</li>
</ul>
<hr>
<h2 id="details">Details</h2>
<p>You may need to call <a href="../SendMovementHeartbeat/"><code>SendMovementHeartbeat</code></a> to force set facing server-side.</p>
