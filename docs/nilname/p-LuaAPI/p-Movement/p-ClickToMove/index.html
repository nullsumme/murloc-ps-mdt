<h1 id="clicktomove">ClickToMove</h1>
<p>Makes your player move, in a direct line, to a specified XYZ world location.</p>
<div class="language-lua highlight"><pre id="__code_0"><span></span><code><span class="nf">ClickToMove</span><span class="p">(</span><span class="nv">x</span><span class="p">,</span><span class="w"> </span><span class="nv">y</span><span class="p">,</span><span class="w"> </span><span class="nv">z</span><span class="p">)</span>
</code></pre></div>
<hr>
<h2 id="arguments">Arguments</h2>
<ul>
<li><strong>x</strong><ul>
<li><code>number</code> : The X-axis world coord</li>
</ul>
</li>
<li><strong>y</strong><ul>
<li><code>number</code> : The Y-axis world coord</li>
</ul>
</li>
<li><strong>z</strong><ul>
<li><code>number</code> : The Z-axis world coord</li>
</ul>
</li>
</ul>
